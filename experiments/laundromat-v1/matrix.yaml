    sample_rate: 48000
    speech_rate: 0
    loudness_rate: 0
    pitch_rate: 0
    enable_subtitle: true

variations: 2

runs:
  - id: baseline
    prompt_file: prompts/01-baseline.txt

  - id: scene-direction
    prompt_file: prompts/02-scene-direction.txt

  - id: microprosody
    prompt_file: prompts/03-microprosody.txt
